name: Build Host Agent Binaries

on:
  push:
    paths:
      - 'scripts/host_agent.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # arm64 (macos-14 jobs get cancelled without a runner)
            arch: arm64
            out: host_agent-darwin-arm64
          - os: macos-15-intel  # x86_64 (macos-13 runner retired: jobs never started)
            arch: amd64
            out: host_agent-darwin-amd64
            optional: true
          - os: ubuntu-22.04
            arch: amd64
            out: host_agent-linux-amd64
          - os: windows-2022
            arch: amd64
            out: host_agent-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: pip install pyinstaller browser-cookie3 pycryptodome

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install pyinstaller browser-cookie3 pycryptodome pywin32

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name ${{ matrix.out }} scripts/host_agent.py \
            --distpath scripts/bin/ --workpath /tmp/build --specpath /tmp/ -y

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --name ${{ matrix.out }} scripts/host_agent.py `
            --distpath scripts/bin/ --workpath $env:TEMP\build --specpath $env:TEMP -y

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: scripts/bin/${{ matrix.out }}
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: host-agent
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum host_agent-* > SHA256SUMS && cat SHA256SUMS

      # Binaries live in a rolling GitHub Release (tag: host-agent), not in git.
      # start.sh / start.ps1 download from:
      #   https://github.com/<owner>/<repo>/releases/download/host-agent/<file>
      - name: Publish rolling release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Host Agent (latest build)" \
              --notes "Built automatically from scripts/host_agent.py. Assets are replaced on every build of main." \
              --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Verify with SHA256SUMS."
